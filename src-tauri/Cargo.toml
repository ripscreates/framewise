[package]
name = "framewise-desktop"
version = "2.1.0"
description = "Framewise desktop application"
authors = ["Framewise contributors"]
edition = "2021"

[lib]
name = "framewise_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
